<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f5f9e">
<title>Line 8 &amp; Tallpack: fault finder and manual</title>
<style>

html { padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: fixed contents rail on the left, one reading column on the right; figures break a little wider than the text. */
:root {
  --paper: #f5f7f8;      /* page ground, slight steel-blue bias */
  --sheet: #ffffff;      /* reading surface */
  --ink: #18212b;
  --ink-2: #4a5866;      /* secondary text */
  --rule: #d9dfe4;
  --rail: #eceff2;
  --accent: #0f5f9e;     /* signal blue, used for links, active states */
  --accent-soft: #e2edf7;
  --warn: #f2b705;       /* ISO warning yellow */
  --warn-bg: #fff7d6;
  --danger: #c4231b;
  --danger-bg: #fde9e7;
  --note-bg: #eaf2f9;
  --label-bg: #fffef4;   /* English overlay label on figures */
  --label-ink: #0b1a2a;
  --label-edge: #0f5f9e;
  --mark: #ffe066;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --rail-w: 300px;
  --col: 46rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f141a; --sheet: #151c24; --ink: #e3e9ef; --ink-2: #9eacb9; --rule: #2a3542; --rail: #121921;
  --accent: #6fb3ec; --accent-soft: #1b2c3d; --warn: #f2c230; --warn-bg: #2c2611; --danger: #ff7b70; --danger-bg: #2f1a19;
  --note-bg: #17283a; --label-bg: #fffef4; --label-ink: #0b1a2a; --label-edge: #6fb3ec; --mark: #6b5a12; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0f141a; --sheet: #151c24; --ink: #e3e9ef; --ink-2: #9eacb9; --rule: #2a3542; --rail: #121921;
  --accent: #6fb3ec; --accent-soft: #1b2c3d; --warn: #f2c230; --warn-bg: #2c2611; --danger: #ff7b70; --danger-bg: #2f1a19;
  --note-bg: #17283a; --label-bg: #fffef4; --label-ink: #0b1a2a; --label-edge: #6fb3ec; --mark: #6b5a12; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 72px; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.6 var(--f-body); }
a { color: var(--accent); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: flex; align-items: center; gap: 12px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--sheet); border-bottom: 1px solid var(--rule);
}
.brand { font: 700 1.05rem/1.1 var(--f-display); letter-spacing: .01em; white-space: nowrap; display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 26px; height: 26px; border-radius: 5px; background: var(--warn); color: #1a1400; display: grid; place-items: center; font: 700 .8rem var(--f-mono); }
.brand small { display: block; font: 500 .72rem/1.2 var(--f-body); color: var(--ink-2); letter-spacing: .02em; }
.menu-btn { display: none; }
.search { position: relative; flex: 1; max-width: 520px; margin-left: auto; }
.search input {
  width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--paper);
}
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: none; stroke: var(--ink-2); stroke-width: 2; }
.results {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px); max-height: min(70vh, 560px); overflow: auto;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 12px 32px rgba(10, 20, 30, .18);
}
.results a { display: block; padding: 10px 14px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--rule); }
.results a:last-child { border-bottom: 0; }
.results a:hover, .results a.sel { background: var(--accent-soft); }
.results .r-t { font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.results .r-m { font: 500 .72rem var(--f-mono); color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
.results .r-s { font-size: .86rem; color: var(--ink-2); }
.results mark { background: var(--mark); color: inherit; border-radius: 2px; }
.results .empty { padding: 14px; color: var(--ink-2); font-size: .9rem; }
.tog { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--ink-2); white-space: nowrap; cursor: pointer; user-select: none; }
.tog input { appearance: none; width: 34px; height: 20px; border-radius: 10px; background: var(--rule); position: relative; cursor: pointer; transition: background .15s; }
.tog input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--sheet); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.tog input:checked { background: var(--accent); }
.tog input:checked::after { transform: translateX(14px); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); align-items: start; }
.rail {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); height: calc(100vh - 57px - env(safe-area-inset-top, 0px));
  overflow: auto; background: var(--rail); border-right: 1px solid var(--rule);
  padding-block: 14px 40px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px;
}
.switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; margin-bottom: 14px; }
.switch button { border: 0; background: none; padding: 7px 6px; border-radius: 5px; cursor: pointer; font: 600 .82rem/1.2 var(--f-display); letter-spacing: .02em; color: var(--ink-2); }
.switch button[aria-pressed="true"] { background: var(--accent); color: var(--sheet); }
.toc { list-style: none; margin: 0; padding: 0; font-size: .88rem; }
.toc a { display: grid; grid-template-columns: 3.1em 1fr; gap: 4px; padding: 4px 8px; border-radius: 5px; text-decoration: none; color: var(--ink); line-height: 1.35; }
.toc a:hover { background: var(--accent-soft); }
.toc a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toc .n { font: 500 .78rem/1.6 var(--f-mono); color: var(--ink-2); }
.toc .l1 > a { font-weight: 600; margin-top: 8px; }
.toc .l3 > a { padding-left: 14px; grid-template-columns: 3.6em 1fr; font-size: .84rem; }
.toc .l4 > a { padding-left: 14px; grid-template-columns: 4.6em 1fr; font-size: .82rem; color: var(--ink-2); }
.toc .err > a .n { color: var(--danger); }
.rail-h { font: 600 .7rem var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin: 18px 8px 6px; }
.quick { display: flex; flex-direction: column; gap: 2px; }
.quick a { padding: 5px 8px; border-radius: 5px; text-decoration: none; font-size: .86rem; color: var(--ink); }
.quick a:hover { background: var(--accent-soft); }

/* ---------- reading column ---------- */
main { min-width: 0; padding-block: 28px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.doc { max-width: calc(var(--col) + 8rem); margin: 0 auto; }
.cover { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 28px 28px 24px; margin-bottom: 28px; display: grid; gap: 6px; }
.cover .kick { font: 600 .74rem var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.cover h1 { font: 700 clamp(1.9rem, 4vw, 2.6rem)/1.05 var(--f-display); margin: 0; text-wrap: balance; }
.cover p { margin: 0; color: var(--ink-2); max-width: 60ch; }
.cover .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font: 400 .8rem var(--f-mono); color: var(--ink-2); }
.cover .note { margin-top: 12px; font-size: .88rem; color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: 12px; }

.pg { position: relative; padding-left: 4.5rem; }
.pg-no { position: absolute; left: 0; top: .3rem; font: 500 .7rem/1.2 var(--f-mono); color: var(--ink-2); letter-spacing: .04em; text-align: left; width: 3.6rem; padding-top: 6px; border-top: 1px solid var(--rule); }
.pg-no b { display: block; font-weight: 600; font-size: .9rem; color: var(--ink); }
.pg > * { max-width: var(--col); }
.pg > .figure { max-width: none; }

h2.h, h3.h, h4.h, h5.h { font-family: var(--f-display); text-wrap: balance; scroll-margin-top: 72px; margin: 2.2rem 0 .7rem; line-height: 1.15; }
h2.h { font-size: 1.85rem; font-weight: 700; padding-top: 1.4rem; border-top: 3px solid var(--ink); }
h3.h { font-size: 1.4rem; font-weight: 600; }
h4.h { font-size: 1.15rem; font-weight: 600; }
h5.h { font-size: 1rem; font-weight: 600; color: var(--ink-2); }
.h .num { font-family: var(--f-mono); font-weight: 500; color: var(--accent); margin-right: .5em; font-size: .8em; }
.h .nl { display: block; font: italic 400 .8rem/1.4 var(--f-body); color: var(--ink-2); margin-top: 4px; }
body.no-nl .h .nl { display: none; }
.nl-inline { font-style: italic; color: var(--ink-2); font-weight: 400; font-size: .88em; }
p { margin: .6rem 0; }
ul.ul, ol.ol { padding-left: 1.3rem; margin: .6rem 0; }
ul.ul li, ol.ol li { margin: .25rem 0; }

/* error card heading (Line 8 robot messages) */
.errhead { margin: 2.4rem 0 .9rem; padding-top: 1.2rem; border-top: 3px solid var(--ink); scroll-margin-top: 72px; }
.errhead h2 { font: 700 1.6rem/1.15 var(--f-display); margin: 0; text-wrap: balance; }
.errhead .num { font-family: var(--f-mono); font-weight: 500; color: var(--accent); margin-right: .5em; font-size: .8em; }
.errhead .nl { display: block; font: italic 400 .8rem/1.4 var(--f-body); color: var(--ink-2); margin-top: 4px; }
body.no-nl .errhead .nl { display: none; }
.errhead .msg { display: inline-block; margin-top: 8px; font: 600 .85rem/1.4 var(--f-mono); background: var(--danger-bg); color: var(--danger); border-left: 4px solid var(--danger); padding: 5px 10px; border-radius: 3px; }

/* callouts */
.warn { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin: 1rem 0; padding: 12px 14px; border-radius: 6px; background: var(--note-bg); }
.warn .ic { width: 26px; height: 26px; }
.warn .wt { font: 700 .76rem var(--f-mono); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2px; }
.warn p { margin: 0; }
.warn.warning { background: var(--warn-bg); border-left: 5px solid var(--warn); }
.warn.danger { background: var(--danger-bg); border-left: 5px solid var(--danger); }
.warn.danger .wt { color: var(--danger); }
.warn.important { background: var(--warn-bg); border-left: 5px solid var(--ink); }
.warn.note { border-left: 5px solid var(--accent); }
.warn.tnote { background: transparent; border: 1px dashed var(--rule); font-size: .86rem; color: var(--ink-2); }
.warn.tnote .wt { color: var(--ink-2); }

/* numbered callout legend */
.callouts { list-style: none; padding: 0; margin: .8rem 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 6px 18px; }
.callouts li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
.callouts .k { min-width: 1.9rem; text-align: center; font: 600 .78rem/1.6 var(--f-mono); background: var(--ink); color: var(--sheet); border-radius: 4px; padding: 0 6px; }

/* F-key actions */
.keys { display: grid; gap: 6px; margin: .9rem 0; }
.keys .row { display: grid; grid-template-columns: 3rem 7.5rem 1fr; gap: 12px; align-items: baseline; padding: 8px 10px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
.fk { font: 600 .78rem/1.8 var(--f-mono); text-align: center; background: #59626b; color: #fff; border-radius: 4px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.35); }
.keys .act { font: 600 .82rem var(--f-mono); letter-spacing: .03em; }

/* definition lists */
dl.dl { margin: .8rem 0; display: grid; grid-template-columns: minmax(9rem, 15rem) 1fr; border-top: 1px solid var(--rule); }
dl.dl dt, dl.dl dd { padding: 8px 0; border-bottom: 1px solid var(--rule); margin: 0; }
dl.dl dt { font-weight: 600; padding-right: 16px; }

/* tables */
.tbl { overflow-x: auto; margin: .8rem 0; }
.tbl table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: .88rem; }
.tbl th, .tbl td { border: 1px solid var(--rule); padding: 4px 14px; text-align: center; }
.tbl th { background: var(--ink); color: var(--sheet); font-family: var(--f-display); font-weight: 600; }
.tbl tr:nth-child(even) td { background: var(--rail); }

/* alarm cards */
.alarms { display: grid; gap: 10px; margin: .9rem 0; }
.alarm { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; scroll-margin-top: 72px; }
.alarm header { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: baseline; padding: 9px 12px; background: var(--accent-soft); }
.alarm .code { font: 600 .82rem var(--f-mono); background: var(--accent); color: var(--sheet); border-radius: 4px; padding: 1px 7px; white-space: nowrap; }
.alarm.wcard header { background: var(--warn-bg); }
.alarm.wcard .code { background: var(--warn); color: #1a1400; }
.alarm .at { font-weight: 600; line-height: 1.35; }
.alarm .anl { display: block; font: italic 400 .78rem/1.4 var(--f-body); color: var(--ink-2); }
body.no-nl .alarm .anl { display: none; }
.alarm .body { display: grid; grid-template-columns: 5.5rem 1fr; gap: 4px 12px; padding: 10px 12px; font-size: .94rem; }
.alarm .lab { font: 600 .72rem/1.9 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.alarm ul { margin: 0; padding-left: 1.1rem; }
.alarm .anote { grid-column: 1 / -1; font-size: .84rem; color: var(--ink-2); border-top: 1px dashed var(--rule); padding-top: 6px; margin-top: 4px; }
.alarm.hit, .errhead.hit, .h.hit { animation: hit 2.2s ease-out; }
@keyframes hit { 0%, 30% { box-shadow: 0 0 0 4px var(--warn); } 100% { box-shadow: 0 0 0 4px transparent; } }


/* parts lists */
.parts { margin: 1rem 0 1.4rem; }
.parts-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font-size: .9rem; padding: 6px 0; border-bottom: 2px solid var(--ink); }
.parts-h .dwg { font: 500 .8rem var(--f-mono); color: var(--ink-2); }
.tbl table.pt, .tbl table.left, .tbl table.ck { font-family: var(--f-body); font-size: .86rem; }
.tbl table.pt td, .tbl table.left td { text-align: left; }
.tbl table.pt td:first-child { text-align: center; font-family: var(--f-mono); }
.tbl td.nlc { font-style: italic; color: var(--ink-2); }
body.no-nl .tbl .nlc { display: none; }
.tbl table.ck th, .tbl table.ck td { padding: 3px 6px; min-width: 1.6rem; }
.tbl table.ck .l { text-align: left; white-space: nowrap; padding-right: 14px; }
.tbl table.ck td.l { background: var(--rail); }
.figure.small .fig-frame { max-width: 9rem; }
.figure.small { display: flex; align-items: center; gap: 16px; }
.figure.small figcaption { margin: 0; font-size: .95rem; color: var(--ink); }

/* ---------- figures with English overlays ---------- */
.figure { margin: 1.2rem 0 1.4rem; }
.fig-frame { position: relative; container-type: inline-size; background: #fff; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; cursor: zoom-in; max-width: 100%; }
.fig-frame img { display: block; width: 100%; height: auto; }
.lab-o { position: absolute; display: flex; align-items: center; overflow: hidden; white-space: nowrap;
  background: var(--label-bg); color: var(--label-ink); border: 1px solid var(--label-edge); border-radius: 2px;
  font: 600 10px/1 var(--f-display); padding: 0 .25em; letter-spacing: .01em; }
.lab-o.v { writing-mode: vertical-rl; transform: rotate(180deg); justify-content: center; padding: .25em 0; }
body.orig .lab-o { display: none; }
.fig-frame.tall { max-width: 34rem; }
.lb-stage .fig-frame.tall { max-width: min(100%, 900px); }
.figure figcaption { font-size: .86rem; color: var(--ink-2); margin-top: 6px; display: flex; gap: 10px; }
.figure figcaption .fn { font: 600 .74rem/1.6 var(--f-mono); color: var(--accent); white-space: nowrap; }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(8, 12, 16, .88); display: grid; grid-template-rows: auto 1fr; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.lb-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #e8edf2; padding-bottom: 10px; font-size: .9rem; }
.lb-bar button { background: #fff; color: #111; border: 0; border-radius: 5px; padding: 6px 12px; cursor: pointer; font-weight: 600; }
.lb-stage { overflow: auto; display: grid; place-items: start center; }
.lb-stage .fig-frame { width: min(100%, 1500px); cursor: default; border: 0; }

.btn-plain { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; cursor: pointer; }

/* ---------- small screens ---------- */
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; left: 0; top: 0; bottom: 0; height: auto; width: min(86vw, 330px); z-index: 40; transform: translateX(-102%); transition: transform .2s; box-shadow: 8px 0 30px rgba(0,0,0,.25); padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
  body.rail-open .rail { transform: none; }
  .menu-btn { display: inline-flex; }
  .brand small, .tog span { display: none; }
  .pg { padding-left: 0; }
  .pg-no { position: static; display: inline-block; border-top: 0; padding: 0; width: auto; margin-top: 1.4rem; }
  .pg-no b { display: inline; margin-left: 4px; }
  dl.dl { grid-template-columns: 1fr; }
  dl.dl dt { border-bottom: 0; padding-bottom: 0; }
  .keys .row { grid-template-columns: 2.6rem 1fr; }
  .keys .row .desc { grid-column: 1 / -1; }
}
@media (max-width: 560px) { .brand-text { display: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ===================== v2: search-first troubleshooting helper ===================== */
:root { --f-display: -apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --f-body: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --tabs-h: 64px; --top-h: 64px; --detail-w: min(46vw, 620px); --op: #1f7a3a; --tech: #8a4b00; --loto: #9b1c1c; }
html, body { overscroll-behavior-y: none; }
body { -webkit-text-size-adjust: 100%; }
.top { gap: 10px; padding-block: 8px; min-height: var(--top-h); }
.top .search { max-width: none; flex: 1; margin: 0; }
.top .search input { font-size: 18px; padding: 12px 44px 12px 42px; border-radius: 12px; border: 2px solid var(--accent); background: var(--sheet); min-height: 48px; }
.top .search svg { left: 13px; width: 20px; height: 20px; }
.kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 600 .72rem var(--f-mono); color: var(--ink-2); border: 1px solid var(--rule); border-radius: 5px; padding: 2px 6px; pointer-events: none; }
.clear-q { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border: 0; border-radius: 50%; background: var(--rail); font-size: 20px; cursor: pointer; }
.tabs { display: flex; gap: 4px; }
.tabs button { flex: 1; border: 0; background: none; padding: 6px 10px; border-radius: 10px; cursor: pointer; font: 600 .86rem/1.1 var(--f-display); color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; }
.tabs button .ti { font-size: 1.25rem; line-height: 1; }
.tabs button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
.app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: calc(100vh - var(--top-h)); }
.view { padding: 14px max(14px, env(safe-area-inset-left, 0px)) calc(var(--tabs-h) + 30px + env(safe-area-inset-bottom, 0px)); max-width: 1100px; margin: 0 auto; width: 100%; }
.view[hidden] { display: none !important; }
#v-manual { max-width: none; padding: 0; }
h1.vh { font: 700 1.5rem/1.15 var(--f-display); margin: .3rem 0 .8rem; }
h2.sh { font: 700 1.1rem/1.2 var(--f-display); margin: 1.4rem 0 .6rem; display: flex; align-items: center; gap: 8px; }
.muted { color: var(--ink-2); font-size: .9rem; }

(() => {

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const strip = s => String(s ?? '').replace(/<[^>]+>/g, '').replace(/&amp;/g, '&');
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const figSrc = id => (window.FIGS && window.FIGS[id]) || `figures/${id}.jpg`;
  const norm = s => strip(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[_\-–—/.,:;!?()"'“”‘’>]+/g, ' ').replace(/\s+/g, ' ').trim();

  const ERR = Object.fromEntries(D.errors.map(e => [e.id, e]));

  const hsOf = {}; for (const [m, list] of Object.entries(D.hotspots)) list.forEach(h => (hsOf[h.node] = hsOf[h.node] || []).push(m));

  // ---------- Dutch words on screen: tappable ----------
  const HMI = D.hmi; const HK = Object.keys(HMI).sort((a, b) => b.length - a.length);
  function nlwrap(text) {
    const t = String(text); let out = '', i = 0; const lc = t.toLowerCase();

  const ICON = {

    const zm = t.closest('[data-zoom]'); if (zm) { openLb(zm.dataset.zoom); return; }
    const la = t.closest('[data-logadd]'); if (la) { const id = la.dataset.logadd; const l = getLog(id); l.push({ t: Date.now(), n: ($('#logNote').value || '').trim() }); store.set('log.' + id, l); openErr(id); renderFixHome(); return; }
    const lc = t.closest('[data-logclr]'); if (lc) { if (confirm('Clear the log for this error on this device?')) { store.set('log.' + lc.dataset.logclr, []); openErr(lc.dataset.logclr); renderFixHome(); } return; }
    const lx = t.closest('[data-logexp]'); if (lx) { const txt = D.errors.flatMap(er => getLog(er.id).map(l => `${new Date(l.t).toISOString()}\t${er.code}\t${er.title}\t${l.n || ''}`)).join('\n'); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => alert('Copied ' + txt.split('\n').length + ' log lines.'), () => prompt('Copy the log:', txt)); return; }
    const ff = t.closest('#doc .fig-frame'); if (ff) { openLb(ff.dataset.fig, ff.outerHTML); return; }
    const a = t.closest('a[href^="#"]'); if (a && a.closest('#v-manual')) { e.preventDefault(); goManual(a.getAttribute('href').slice(1)); return; }
    if (document.body.classList.contains('rail-open') && !t.closest('.rail, #menuBtn')) document.body.classList.remove('rail-open');
  });
  $$('.tabs button').forEach(b => b.onclick = () => { show(b.dataset.view); window.scrollTo(0, 0); });
  $('#swA').onclick = () => { renderManual('A'); window.scrollTo(0, 0); };
  $('#swB').onclick = () => { renderManual('B'); window.scrollTo(0, 0); };
  $('#menuBtn').onclick = e => { e.stopPropagation(); document.body.classList.toggle('rail-open'); };
  const labTog = $('#labTog'), nlTog = $('#nlTog');
  labTog.checked = store.get('labels', true); nlTog.checked = store.get('nl', true);
  const applyTog = () => { document.body.classList.toggle('orig', !labTog.checked); document.body.classList.toggle('no-nl', !nlTog.checked); store.set('labels', labTog.checked); store.set('nl', nlTog.checked); };
  labTog.onchange = applyTog; nlTog.onchange = applyTog; applyTog();

  // ================= START =================
  const mq = matchMedia('(min-width: 1100px)'); const setSplit = () => $('.app').classList.toggle('split', mq.matches); setSplit(); mq.addEventListener ? mq.addEventListener('change', setSplit) : mq.addListener(setSplit);
  renderFixHome(); renderStart(); renderGloss(); renderMap();
  function route(h0) {
    if (h0.startsWith('err=')) { show('fix'); openErr(h0.slice(4)); return true; }
    if (h0.startsWith('node=')) { show('map'); openNode(h0.slice(5)); return true; }
    if (h0.startsWith('view=')) { show(h0.slice(5)); return true; }
    if (h0 && (h0.startsWith('l8-') || h0.startsWith('tp-') || h0.startsWith('alarm-') || h0.startsWith('warning-'))) { goManual(h0); return true; }
    return false;
  }
  if (!route(decodeURIComponent(location.hash.slice(1))))
    show(store.get('view', 'fix') === 'manual' ? 'manual' : (store.get('visited', false) ? store.get('view', 'fix') : 'start'));
  addEventListener('hashchange', () => route(decodeURIComponent(location.hash.slice(1))));
  store.set('visited', true);
  if (mq.matches && !detailFor) { const f = D.errors.find(e => e.frequent); if (f && view !== 'manual') openErr(f.id); }
  document.fonts && document.fonts.ready.then(() => $$('.fig-frame').forEach(fitLabels));
  window.__app = { search, openErr, openNode, goMap, show };
})();

</script>
